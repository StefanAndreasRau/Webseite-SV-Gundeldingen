name: Monatliche Agenda-Bereinigung

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: News und Agenda bereinigen
        run: node scripts/prune-content.js

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/agenda.json
          if git diff --staged --quiet; then
            echo "Nichts zu committen."
          else
            git commit -m "Monatliche Bereinigung: News auf 3 Einträge, vergangene Agenda-Monate entfernt."
            git push
          fi
